<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple AI Gateway</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e5e5e8;
    --text: #1c1c1f;
    --muted: #6b7280;
    --accent: #2f6feb;
    --danger: #d23f3f;
    --code: #f2f2f4;
    --j-key: #905900;
    --j-str: #3d7a2e;
    --j-num: #1c6f7d;
    --j-bool: #b04020;
    --j-null: #6a5acd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #2a2e38;
      --text: #e8e8ea;
      --muted: #9aa0aa;
      --accent: #7aa6ff;
      --danger: #ef5a5a;
      --code: #11141a;
      --j-key: #e0b04a;
      --j-str: #98c379;
      --j-num: #56b6c2;
      --j-bool: #e06c75;
      --j-null: #c678dd;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 16px; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 500; padding: 4px 8px; border-radius: 6px; }
  nav a.active { color: var(--accent); background: rgba(47,111,235,0.08); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  button { background: var(--accent); color: white; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 500; cursor: pointer; font-size: 13px; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, select { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: var(--code); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-card { width: 360px; max-width: 100%; }
  .login-card .panel { padding: 28px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .row > * { flex: 1; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--code); color: var(--muted); }
  .pill.ok { background: rgba(60,160,90,0.18); color: #4ec47e; }
  .pill.err { background: rgba(210,63,63,0.18); color: #ef7373; }
  .secret-banner { background: rgba(60,160,90,0.12); border: 1px solid rgba(60,160,90,0.35); padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; }
  .secret-banner .code { display: block; padding: 10px; margin-top: 8px; word-break: break-all; }
  .status-msg { color: var(--danger); font-size: 13px; min-height: 18px; }
  .right { float: right; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: rgba(122,166,255,0.06); }
  /* Log detail page */
  .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .detail-head .back { color: var(--accent); text-decoration: none; font-size: 13px; }
  .detail-head .back:hover { text-decoration: underline; }
  .detail-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .summary-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 36px; }
  @media (max-width: 800px) { .summary-cols { grid-template-columns: 1fr; } }
  .summary-cols dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; font-size: 13px; align-items: baseline; }
  .summary-cols dt { color: var(--muted); font-weight: 500; font-size: 12px; }
  .summary-cols dd { margin: 0; word-break: break-word; }
  /* Tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin: 0 0 12px; }
  .tab { padding: 8px 14px; cursor: pointer; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .pane-actions { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin-bottom: 6px; }
  .pane-actions label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--muted); }
  .pane-actions input[type=checkbox] { margin: 0; }
  .ghost-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; font-weight: 500; }
  .ghost-btn:hover { color: var(--text); border-color: var(--accent); }
  /* Body pre */
  .detail-pre { background: var(--code); padding: 14px 16px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; margin: 0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .detail-pre.wrap { white-space: pre-wrap; word-break: break-word; }
  /* JSON syntax highlight */
  .json-key { color: var(--j-key); }
  .json-str { color: var(--j-str); }
  .json-num { color: var(--j-num); }
  .json-bool { color: var(--j-bool); font-weight: 500; }
  .json-null { color: var(--j-null); }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
const $ = (sel, el = document) => el.querySelector(sel);

const Store = {
  get token() { return localStorage.getItem("gw_token"); },
  set token(v) { v ? localStorage.setItem("gw_token", v) : localStorage.removeItem("gw_token"); },
  get who() { return localStorage.getItem("gw_who"); },
  set who(v) { v ? localStorage.setItem("gw_who", v) : localStorage.removeItem("gw_who"); },
};

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (Store.token) headers["Authorization"] = `Bearer ${Store.token}`;
  if (opts.body && typeof opts.body !== "string") {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { Store.token = null; renderRoute("#/login"); throw new Error("unauthorized"); }
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`${res.status}: ${txt}`);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.text();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function highlightJson(jsonText) {
  const esc = String(jsonText).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  return esc.replace(
    /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(?:\s*:)?)|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?/g,
    (match) => {
      let cls = "json-num";
      if (/^"/.test(match)) cls = /:\s*$/.test(match) ? "json-key" : "json-str";
      else if (match === "true" || match === "false") cls = "json-bool";
      else if (match === "null") cls = "json-null";
      return `<span class="${cls}">${match}</span>`;
    }
  );
}

// Returns HTML-safe string ready to inject into a <pre>. Tries JSON; falls
// back to per-line SSE "data: {json}" formatting; otherwise escaped raw text.
function formatBody(s) {
  if (s == null || s === "") return "-";
  const str = String(s).trim();
  try { return highlightJson(JSON.stringify(JSON.parse(str), null, 2)); } catch {}
  if (str.includes("data:")) {
    const lines = str.split(/\r?\n/);
    let touched = false;
    const out = lines.map(line => {
      const m = line.match(/^(data:\s*)(.+)$/);
      if (!m) return escapeHtml(line);
      try {
        const pretty = JSON.stringify(JSON.parse(m[2]), null, 2);
        touched = true;
        return escapeHtml(m[1]) + highlightJson(pretty);
      } catch { return escapeHtml(line); }
    });
    if (touched) return out.join("\n");
  }
  return escapeHtml(str);
}

function fmtTs(ms) {
  if (!ms) return "-";
  return new Date(ms).toISOString().replace("T", " ").replace(/\.\d+Z$/, "Z");
}

function navHtml(active) {
  const items = [["#/keys", "Keys"], ["#/logs", "Logs"], ["#/cost", "Cost"]];
  return `<nav>${items.map(([h,l])=>`<a href="${h}" class="${active===h?'active':''}">${l}</a>`).join("")}</nav>`;
}

function headerHtml(active) {
  const who = Store.who || "";
  return `<header>
    <h1>Simple AI Gateway</h1>
    ${navHtml(active)}
    <div class="muted">${escapeHtml(who)} <button class="secondary" onclick="window.logout()">Logout</button></div>
  </header>`;
}

window.logout = () => { Store.token = null; Store.who = null; renderRoute("#/login"); };

async function viewLogin() {
  document.body.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="panel">
          <h2 style="margin:0 0 18px 0">Sign in</h2>
          <form id="lf">
            <div class="field"><label>Username</label><input name="u" autocomplete="username" required></div>
            <div class="field"><label>Password</label><input name="p" type="password" autocomplete="current-password" required></div>
            <button type="submit">Sign in</button>
            <div class="status-msg" id="msg"></div>
          </form>
          <p class="muted" style="margin-top:16px;font-size:12px">Use the root token to create the first admin via:<br>
            <span class="code">POST /admin/admins</span></p>
        </div>
      </div>
    </div>`;
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    const u = e.target.u.value, p = e.target.p.value;
    try {
      const r = await api("/admin/auth/login", { method: "POST", body: { username: u, password: p } });
      Store.token = r.token; Store.who = r.username;
      renderRoute("#/keys");
    } catch (err) { $("#msg").textContent = "Login failed"; }
  };
}

async function viewKeys() {
  document.body.innerHTML = `
    ${headerHtml("#/keys")}
    <main>
      <div class="toolbar">
        <input id="kname" placeholder="key name (e.g. prod-svc)">
        <select id="kenv"><option value="live">live</option><option value="test">test</option></select>
        <button onclick="window.createKey()">Create key</button>
      </div>
      <div id="banner"></div>
      <div class="panel"><div id="ktbl">Loading…</div></div>
    </main>`;
  await reloadKeys();
}

async function reloadKeys() {
  try {
    const rows = await api("/admin/keys");
    const html = rows.length === 0 ? `<div class="muted">No keys yet. Create one above.</div>` :
      `<table><thead><tr><th>Name</th><th>Origin</th><th>Prefix</th><th>Last 4</th><th>Status</th><th>Created</th><th>Last used</th><th></th></tr></thead>
       <tbody>${rows.map(r=>`<tr>
         <td>${escapeHtml(r.name)}</td>
         <td>${r.origin==='config'?`<span class="pill" title="Managed by config file">config</span>`:`<span class="muted">admin</span>`}</td>
         <td><span class="code">${escapeHtml(r.prefix)}</span></td>
         <td><span class="code">…${escapeHtml(r.last4)}</span></td>
         <td><span class="pill ${r.status==='active'?'ok':'err'}">${r.status}</span></td>
         <td class="muted">${fmtTs(r.created_at)}</td>
         <td class="muted">${fmtTs(r.last_used_at)}</td>
         <td>${r.status==='active' && r.origin!=='config'?`<button class="danger secondary" onclick="window.revoke('${r.id}')">Revoke</button>`:''}</td>
       </tr>`).join("")}</tbody></table>`;
    $("#ktbl").innerHTML = html;
  } catch (e) { $("#ktbl").innerHTML = `<div class="status-msg">${escapeHtml(e.message)}</div>`; }
}

window.createKey = async () => {
  const name = $("#kname").value.trim(); const env = $("#kenv").value;
  if (!name) return;
  try {
    const r = await api("/admin/keys", { method: "POST", body: { name, env } });
    $("#banner").innerHTML = `<div class="secret-banner">
      <strong>Secret created. Copy it now — it will not be shown again.</strong>
      <span class="code">${escapeHtml(r.secret)}</span>
    </div>`;
    $("#kname").value = "";
    await reloadKeys();
  } catch (e) { alert(e.message); }
};

window.revoke = async (id) => {
  if (!confirm("Revoke this key?")) return;
  await api(`/admin/keys/${id}`, { method: "DELETE" });
  await reloadKeys();
};

async function viewLogs() {
  document.body.innerHTML = `
    ${headerHtml("#/logs")}
    <main>
      <div class="toolbar">
        <input id="fprov" placeholder="namespace (e.g. openai)">
        <input id="fmodel" placeholder="model">
        <select id="fkey"><option value="">any key</option></select>
        <select id="fstatus">
          <option value="">any status</option>
          <option value="success">success</option>
          <option value="upstream_error">upstream_error</option>
          <option value="gateway_error">gateway_error</option>
          <option value="timeout">timeout</option>
        </select>
        <button onclick="window.reloadLogs()">Apply</button>
      </div>
      <div class="panel"><div id="ltbl">Loading…</div></div>
    </main>`;
  await populateKeyFilter();
  await reloadLogs();
}

async function populateKeyFilter() {
  const sel = $("#fkey");
  if (!sel) return;
  try {
    const rows = await api("/admin/keys");
    for (const k of rows) {
      const label = `${k.name} (${k.prefix}…${k.last4})${k.status === 'active' ? '' : ' [' + k.status + ']'}`;
      const opt = document.createElement("option");
      opt.value = k.id;
      opt.textContent = label;
      sel.appendChild(opt);
    }
  } catch (_) { /* leave the filter as just "any key" if listing fails */ }
}

window.reloadLogs = async () => {
  const params = new URLSearchParams();
  const p = $("#fprov").value.trim(); if (p) params.set("namespace", p);
  const m = $("#fmodel").value.trim(); if (m) params.set("model", m);
  const k = $("#fkey").value; if (k) params.set("gateway_key_id", k);
  const s = $("#fstatus").value; if (s) params.set("status", s);
  params.set("limit", "100");
  try {
    const r = await api(`/admin/logs?${params}`);
    const rows = r.items || [];
    const html = rows.length === 0 ? `<div class="muted">No logs yet.</div>` :
      `<table><thead><tr><th>Time</th><th>Namespace</th><th>Model</th><th>Endpoint</th><th>Status</th><th>HTTP</th><th>Cached</th><th>Latency</th></tr></thead>
       <tbody>${rows.map(r=>`<tr class="clickable" onclick="window.openLogTab('${r.id}')">
         <td class="muted">${fmtTs(r.request_ts)}</td>
         <td>${escapeHtml(r.namespace||'')}</td>
         <td>${escapeHtml(r.model||'')}</td>
         <td class="muted">${escapeHtml(r.endpoint||'')}</td>
         <td><span class="pill ${r.status==='success'?'ok':'err'}">${escapeHtml(r.status)}</span></td>
         <td>${r.http_status||''}</td>
         <td>${r.cached?'✓':''}</td>
         <td class="muted">${r.duration_ms!=null?r.duration_ms+' ms':''}</td>
       </tr>`).join("")}</tbody></table>`;
    $("#ltbl").innerHTML = html;
  } catch (e) { $("#ltbl").innerHTML = `<div class="status-msg">${escapeHtml(e.message)}</div>`; }
};

window.openLogTab = (id) => {
  // Same SPA, different hash route — opens cleanly in a new tab.
  window.open(`${location.pathname}${location.search}#/logs/${encodeURIComponent(id)}`, "_blank");
};

async function viewLogDetail(id) {
  document.body.innerHTML = `
    ${headerHtml("#/logs")}
    <main><div id="logDetail">Loading…</div></main>`;
  try {
    const d = await api(`/admin/logs/${encodeURIComponent(id)}`);
    renderLogDetail(d);
  } catch (e) {
    $("#logDetail").innerHTML = `<div class="status-msg">${escapeHtml(e.message)}</div>`;
  }
}

function renderLogDetail(d) {
  const meta = d.metadata ? JSON.stringify(d.metadata, null, 2) : "";
  const ms = (v) => (v != null ? v + " ms" : "-");
  const num = (v) => (v != null ? v : "-");
  // Derive the actual upstream that served this request. When a fallback
  // fires, `fallback_used` holds the provider name; otherwise the last
  // attempt in the trace has the real upstream (which can differ from the
  // URL namespace when match.namespace decouples them).
  const attempts = Array.isArray(d.metadata?.attempts) ? d.metadata.attempts : [];
  const lastProvider = attempts.length ? attempts[attempts.length - 1]?.provider : null;
  const upstreamProvider = d.fallback_used || lastProvider || d.namespace || "-";
  const providerCell = d.fallback_used
    ? `${escapeHtml(d.fallback_used)} <span class="muted">(via fallback)</span>`
    : escapeHtml(upstreamProvider);
  const left = [
    ["Time", `<span class="muted">${fmtTs(d.request_ts)}</span>`],
    ["Namespace", escapeHtml(d.namespace || "-")],
    ["Provider", providerCell],
    ["Model", escapeHtml(d.model || "-")],
    ["Endpoint", `<span class="muted">${escapeHtml(d.endpoint || "-")}</span>`],
    ["Status", `<span class="pill ${d.status === 'success' ? 'ok' : 'err'}">${escapeHtml(d.status)}</span> ${d.http_status || ""}`],
    ["Cached", d.cached ? "yes" : "no"],
    ["Retries", d.retry_count || 0],
    ["Client IP", escapeHtml(d.client_ip || "-")],
  ];
  const right = [
    ["Duration", ms(d.duration_ms)],
    ["Upstream", ms(d.upstream_ms)],
    ["TTFB", ms(d.ttfb_ms)],
    ["Prompt tokens", num(d.prompt_tokens)],
    ["Completion tokens", num(d.completion_tokens)],
    ["Cached tokens", num(d.cached_tokens)],
    ["Total tokens", num(d.total_tokens)],
    ["User-Agent", `<span class="muted">${escapeHtml(d.user_agent || "-")}</span>`],
  ];
  const dl = (rows) => `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const copyBtn = (target) => `<button type="button" class="ghost-btn" onclick="window.copyPane('${target}', this)">Copy</button>`;
  const wrapToggle = (key) => `<label><input type="checkbox" onchange="window.toggleWrap('${key}', this.checked)"> Wrap lines</label>`;
  $("#logDetail").innerHTML = `
    <div class="detail-head">
      <a class="back" href="#/logs">← Back to logs</a>
      <h2>Request <span class="code">${escapeHtml(d.id)}</span></h2>
      <button type="button" class="ghost-btn" style="margin-left:auto" onclick="window.copyCurl(this)" data-curl="${escapeHtml(buildCurl(d))}" title="Replays the request with $GATEWAY_KEY as a placeholder">Copy as curl</button>
    </div>
    <div class="panel"><div class="summary-cols">${dl(left)}${dl(right)}</div></div>
    <div class="panel" style="margin-top:16px">
      <div class="tabs" role="tablist">
        <button type="button" class="tab" data-tab="meta" onclick="window.switchBodyTab('meta')">Metadata</button>
        <button type="button" class="tab active" data-tab="req" onclick="window.switchBodyTab('req')">Request body</button>
        <button type="button" class="tab" data-tab="res" onclick="window.switchBodyTab('res')">Response body</button>
        ${d.error_message ? `<button type="button" class="tab" data-tab="err" onclick="window.switchBodyTab('err')">Error</button>` : ""}
      </div>
      <div class="tab-pane" data-pane="meta">
        <div class="pane-actions">${copyBtn('bodyMeta')}</div>
        <pre class="detail-pre" id="bodyMeta">${meta ? highlightJson(meta) : "-"}</pre>
      </div>
      <div class="tab-pane active" data-pane="req">
        <div class="pane-actions">${copyBtn('bodyReq')}${wrapToggle('req')}</div>
        <pre class="detail-pre" id="bodyReq">${formatBody(d.request_body)}</pre>
      </div>
      <div class="tab-pane" data-pane="res">
        <div class="pane-actions">${copyBtn('bodyRes')}${wrapToggle('res')}</div>
        <pre class="detail-pre" id="bodyRes">${formatBody(d.response_body)}</pre>
      </div>
      ${d.error_message ? `<div class="tab-pane" data-pane="err">
        <div class="pane-actions">${copyBtn('bodyErr')}</div>
        <pre class="detail-pre" id="bodyErr">${escapeHtml(d.error_message)}</pre>
      </div>` : ""}
    </div>`;
}

window.switchBodyTab = (key) => {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === key));
  document.querySelectorAll(".tab-pane").forEach(p => p.classList.toggle("active", p.dataset.pane === key));
};

window.toggleWrap = (key, on) => {
  const id = key === "req" ? "bodyReq" : key === "res" ? "bodyRes" : null;
  if (!id) return;
  const el = document.getElementById(id);
  if (el) el.classList.toggle("wrap", !!on);
};

function buildCurl(d) {
  const url = `${location.origin}/v1/${d.namespace || ""}${d.endpoint || ""}`;
  const body = d.request_body || "";
  const truncated = body.endsWith("…[truncated]");
  const method = body ? "POST" : "GET";
  // Escape chars that are special inside double-quoted shell strings: \ " $ `
  const shq = s => s.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\$/g, "\\$").replace(/`/g, "\\`");
  const parts = [
    `curl -X ${method} "${shq(url)}"`,
    // $GATEWAY_KEY left unescaped so the shell expands it
    `  -H "Authorization: Bearer $GATEWAY_KEY"`,
  ];
  if (body) {
    parts.push(`  -H "Content-Type: application/json"`);
    parts.push(`  --data-raw "${shq(body)}"`);
  }
  let s = parts.join(" \\\n");
  if (truncated) s = `# NOTE: logged request body is truncated to 64KB; curl will not replay faithfully.\n${s}`;
  return s;
}

window.copyCurl = async (btn) => {
  const text = btn.dataset.curl || "";
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copied";
  } catch {
    btn.textContent = "Failed";
  }
  setTimeout(() => { btn.textContent = original; }, 1200);
};

window.copyPane = async (elementId, btn) => {
  const el = document.getElementById(elementId);
  if (!el) return;
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(el.textContent);
    btn.textContent = "Copied";
  } catch {
    btn.textContent = "Failed";
  }
  setTimeout(() => { btn.textContent = original; }, 1200);
};

async function viewCost() {
  document.body.innerHTML = `
    ${headerHtml("#/cost")}
    <main>
      <div class="toolbar">
        <select id="cgroup">
          <option value="namespace,model">by namespace+model</option>
          <option value="day">by day</option>
          <option value="namespace,model,day">by namespace+model+day</option>
          <option value="gateway_key">by key</option>
        </select>
        <button onclick="window.reloadCost()">Apply</button>
      </div>
      <div class="panel" id="budgetsPanel" style="margin-bottom:16px"></div>
      <div class="panel" id="costPanel">Loading…</div>
    </main>`;
  await reloadBudgets();
  await reloadCost();
}

window.reloadBudgets = async () => {
  try {
    const list = await api("/admin/budgets");
    if (!list.length) { $("#budgetsPanel").innerHTML = `<div class="muted">No budgets configured.</div>`; return; }
    $("#budgetsPanel").innerHTML = `<h3 style="margin:0 0 10px;font-size:14px">Budgets</h3>
      ${list.map(b => {
        const pct = Math.min(100, Math.max(0, Math.round(b.pct*100)));
        const color = b.blocked ? 'var(--danger)' : (pct>=80?'#d29a1a':'var(--accent)');
        return `<div style="margin:8px 0">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span><strong>${escapeHtml(b.name)}</strong> <span class="muted">(${escapeHtml(b.period)})</span></span>
            <span class="muted">$${b.used_usd.toFixed(4)} / $${b.amount_usd.toFixed(2)} (${pct}%)${b.blocked?' • BLOCKED':''}</span>
          </div>
          <div style="height:8px;background:var(--code);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${color}"></div>
          </div>
        </div>`;
      }).join("")}`;
  } catch (e) { $("#budgetsPanel").innerHTML = `<div class="status-msg">${escapeHtml(e.message)}</div>`; }
};

window.reloadCost = async () => {
  const gb = $("#cgroup").value;
  try {
    const r = await api(`/admin/cost?group_by=${encodeURIComponent(gb)}`);
    const groups = r.groups || [];
    const headers = Object.keys(groups[0]?.key || {});
    const html = groups.length === 0 ? `<div class="muted">No cost data yet. Make a few requests with a known model first.</div>` :
      `<div style="margin-bottom:10px">Total: <strong>$${r.total_cost_usd.toFixed(6)}</strong></div>
       <table><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}
          <th>requests</th><th>prompt</th><th>completion</th><th>cost (USD)</th><th>savings</th></tr></thead>
       <tbody>${groups.map(g=>`<tr>
         ${headers.map(h=>`<td>${escapeHtml(g.key[h]||'-')}</td>`).join("")}
         <td>${g.requests}</td>
         <td>${g.prompt_tokens}</td>
         <td>${g.completion_tokens}</td>
         <td>$${g.cost_usd.toFixed(6)}</td>
         <td class="muted">$${g.cached_savings_usd.toFixed(6)}</td>
       </tr>`).join("")}</tbody></table>`;
    $("#costPanel").innerHTML = html;
  } catch (e) { $("#costPanel").innerHTML = `<div class="status-msg">${escapeHtml(e.message)}</div>`; }
};

async function renderRoute(route) {
  if (!route || route === "#/" || route === "") route = Store.token ? "#/keys" : "#/login";
  if (!Store.token && route !== "#/login") { window.location.hash = "#/login"; return; }
  if (route === "#/login") return viewLogin();
  if (route === "#/keys") return viewKeys();
  if (route === "#/logs") return viewLogs();
  const logMatch = route.match(/^#\/logs\/(.+)$/);
  if (logMatch) return viewLogDetail(decodeURIComponent(logMatch[1]));
  if (route === "#/cost") return viewCost();
  return viewKeys();
}

window.addEventListener("hashchange", () => renderRoute(window.location.hash));
renderRoute(window.location.hash);
</script>
</body>
